name: Compilar Nix Ai (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Could not|Caused by" -A2 build.log | head -c 3800 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=BUILD FAILED::$msg"
            exit $code
          fi
          cp app/build/outputs/apk/debug/app-debug.apk NixAi.apk

      - name: Diagnostico de la libreria LiteRT-LM
        if: always()
        run: |
          AAR=$(find ~/.gradle -name "litertlm-android*.aar" | head -1)
          if [ -n "$AAR" ]; then
            mkdir -p /tmp/aar && cd /tmp/aar && unzip -oq "$AAR"
            note() { # titulo, contenido
              esc=$(printf '%s' "$2" | head -c 5500 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::notice title=$1::$esc"
            }
            note "Contenido-clases" "$(unzip -l classes.jar | grep -o 'com/google/ai/edge/litertlm/[A-Za-z$]*\.class' | tr '\n' ' ')"
            note "Content-Text" "$(javap -p -cp classes.jar 'com.google.ai.edge.litertlm.Content$Text' 2>&1 | head -20)$(javap -p -c -cp classes.jar com.google.ai.edge.litertlm.Contents 2>&1 | grep -A25 'String toString' | head -40)"
            note "Message-toString" "$(javap -p -c -cp classes.jar com.google.ai.edge.litertlm.Message 2>&1 | grep -A30 'String toString' | head -45)"
            note "Message-Companion" "$(javap -p -cp classes.jar 'com.google.ai.edge.litertlm.Message$Companion' 2>&1 | head -20)"
            note "Config" "$(javap -p -cp classes.jar com.google.ai.edge.litertlm.SamplerConfig 2>&1 | head -14) $(javap -p -cp classes.jar com.google.ai.edge.litertlm.EngineConfig 2>&1 | head -14)"
            note "Engine" "$(javap -p -cp classes.jar com.google.ai.edge.litertlm.Engine 2>&1 | head -25) $(javap -p -cp classes.jar com.google.ai.edge.litertlm.ConversationConfig 2>&1 | head -14)"
            note "Conversation-async" "$(javap -p -cp classes.jar com.google.ai.edge.litertlm.Conversation 2>&1 | grep -iE 'async|cancel|Flow' | head -12)"
          fi

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NixAi-apk
          path: NixAi.apk

      - name: Publicar Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-${{ github.run_number }}
          name: Nix Ai v2.0 (build ${{ github.run_number }})
          files: NixAi.apk
