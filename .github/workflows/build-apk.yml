name: Compilar Nix Ai (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk NixAi.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NixAi-apk
          path: NixAi.apk

      - name: Publicar Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Nix Ai v1.0 (build ${{ github.run_number }})
          files: NixAi.apk
